name: cadence

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadence
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cadence_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadence_db_data:
